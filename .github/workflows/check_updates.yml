name: Check for Updates in Packages

# Trigger the action on the 'sub-add' branch only
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: '0 0 * * *'  # Runs everyday
  workflow_dispatch:

jobs:
  check-for-updates:
    # Runs repo-controlled code (./newver-checker) on PR and queue refs,
    # so this job only ever gets a read-only token.
    permissions:
      contents: read
    runs-on: ubuntu-latest  # Use an Ubuntu runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7  # Checks out the repository code
        # with:
        #   submodules: 'true'

      - name: Set up Python
        uses: 'actions/setup-python@v7'
        with:
          python-version: '3.13'  # Specify Python version
      - run: pip install nvchecker

      - name: Initialize submodule
        run: |
          git submodule update --init --recursive  # Initialize and update the submodule

      - name: List files in the submodule
        run: |
          tree
          chmod +x ./newver-checker

      - name: Run newver-checker
        run: |
          NEWVER_OUTPUT=$(./newver-checker)
          NVLOG_NEW=$(echo "$NEWVER_OUTPUT" | awk '{for(i=7;i<=10;i++) printf "%s ", $i; print ""}')
          echo "$NVLOG_NEW" > nvchecker.log

          # Format PR body with diff code block
          {
            echo "## Updates"
            echo ""
            echo '```diff'
            git diff nvchecker.log | grep '^[-+]' | grep -v '^[-+][-+][-+]' || true
            echo '```'
          } > pr_body.md

      - name: Upload checker output
        uses: actions/upload-artifact@v7
        with:
          name: nvchecker
          path: |
            nvchecker.log
            pr_body.md

  open-update-pr:
    # PR and queue runs only verify the checker works. Opening update PRs
    # from them spams branches and needs PR-creation rights the token lacks.
    # Only this job holds a write token, and only on trusted events.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: check-for-updates
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download checker output
        uses: actions/download-artifact@v7
        with:
          name: nvchecker

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Update Package Version
          signoff: true
          sign-commits: true
          branch-suffix: 'random'
          delete-branch: true
          base: 'main'
          title: Update Packages in AUR
          body-path: pr_body.md
          labels: automated, version-update
          assignees: bupd
          reviewers: bupd
